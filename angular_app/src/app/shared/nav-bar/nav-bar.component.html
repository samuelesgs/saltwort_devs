<div
    class="grid grid-cols-3 items-center bg-primary-dark px-20 py-2 primary-ligth">
    <div
        class="flex flex-row gap-5 items-center">
        <img
            src="./assets/images/icon-app.png"
            alt="app-icon"
            class="h-14 w-14">
        <p
            class="font-light hover:underline cursor-pointer"
            routerLink="Home">
            Saltwort Devs
        </p>
    </div>
    <div
        class="flex justify-center gap-5">
        <p
            class="font-light hover:underline cursor-pointer"
            routerLink="Home">
            {{'page.home' | translate}}
        </p>
        <!-- <p
            class="font-light hover:underline cursor-pointer"
            routerLink="Proyects">
            Proyectos
        </p> -->
        <p
            class="font-light hover:underline cursor-pointer"
            routerLink="Developers">
            {{'page.devs' | translate}}
        </p>
        <p
            class="font-light hover:underline cursor-pointer"
            routerLink="About_of">
            {{'page.about' | translate}}
        </p>
    </div>
    <div
        class="flex justify-end">
        <div class="relative flex justify-end">
            <button 
                (click)="toggleDropdown()"
                type="button"
                class="inline-flex items-center gap-x-1.5 rounded-md px-3 py-2 hover:underline cursor-pointer">
                
                {{ currentLang.toLocaleUpperCase() }}
                
                <svg class="h-5 w-5 transition-transform duration-200"
                    [class.rotate-180]="isOpen"
                    viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                    clip-rule="evenodd" />
                </svg>
            </button>

            <!-- Dropdown -->
            <div *ngIf="isOpen"
                class="absolute right-0 top-8 mt-2 w-30 rounded-md border border-gray-700 bg-primary-dark primary-ligth shadow-lg ring-1 ring-black/5 z-50">
                
                <ul class="py-1 text-sm">
                    <li 
                        (click)="selectLang('es')"
                        class="px-4 py-2 hover:underline cursor-pointer">
                        Español
                    </li>
                    <li 
                        (click)="selectLang('en')"
                        class="px-4 py-2 hover:underline cursor-pointer">
                        Inglés
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
